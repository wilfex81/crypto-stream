<svg viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b94a8"/>
    </marker>
  </defs>

  <rect width="1360" height="640" fill="#0f1420"/>

  <!-- Title -->
  <text x="40" y="40" fill="#e4e8f1" font-size="20" font-weight="600">crypto-stream — architecture</text>
  <text x="40" y="62" fill="#7d8aa8" font-size="12.5">Binance → Kafka → S3 (lake) → Databricks Unity Catalog (lakehouse) → Snowflake (warehouse) → Metabase</text>

  <!-- Ingestion -->
  <g>
    <rect x="30" y="110" width="170" height="70" rx="8" fill="#1a2234" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="115" y="138" fill="#e4e8f1" font-size="13" font-weight="600" text-anchor="middle">Binance</text>
    <text x="115" y="156" fill="#9aa5bd" font-size="11" text-anchor="middle">WebSocket trade stream</text>
  </g>

  <line x1="200" y1="145" x2="248" y2="145" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="110" width="170" height="70" rx="8" fill="#1a2234" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="335" y="132" fill="#e4e8f1" font-size="13" font-weight="600" text-anchor="middle">Kafka</text>
    <text x="335" y="150" fill="#9aa5bd" font-size="11" text-anchor="middle">producer → topic</text>
    <text x="335" y="165" fill="#9aa5bd" font-size="11" text-anchor="middle">→ consumer</text>
  </g>

  <line x1="420" y1="145" x2="468" y2="145" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lake -->
  <g>
    <rect x="470" y="110" width="170" height="70" rx="8" fill="#1a2234" stroke="#e0a752" stroke-width="1.5"/>
    <text x="555" y="138" fill="#e4e8f1" font-size="13" font-weight="600" text-anchor="middle">S3 landing</text>
    <text x="555" y="156" fill="#9aa5bd" font-size="11" text-anchor="middle">raw JSON — data lake</text>
  </g>

  <line x1="555" y1="180" x2="555" y2="225" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="207" fill="#7d8aa8" font-size="10.5">Auto Loader</text>

  <!-- Lakehouse: Unity Catalog bronze/silver/gold -->
  <rect x="440" y="230" width="500" height="230" rx="10" fill="none" stroke="#46d3ac" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="460" y="250" fill="#46d3ac" font-size="12" font-weight="600">Databricks Unity Catalog (dbt)</text>

  <g>
    <rect x="465" y="265" width="140" height="60" rx="8" fill="#1a2234" stroke="#46d3ac" stroke-width="1.5"/>
    <text x="535" y="290" fill="#e4e8f1" font-size="12.5" font-weight="600" text-anchor="middle">bronze</text>
    <text x="535" y="307" fill="#9aa5bd" font-size="10.5" text-anchor="middle">raw, trade grain</text>
  </g>

  <line x1="605" y1="295" x2="645" y2="295" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="650" y="265" width="140" height="60" rx="8" fill="#1a2234" stroke="#46d3ac" stroke-width="1.5"/>
    <text x="720" y="290" fill="#e4e8f1" font-size="12.5" font-weight="600" text-anchor="middle">silver</text>
    <text x="720" y="307" fill="#9aa5bd" font-size="10.5" text-anchor="middle">deduped, conformed</text>
  </g>

  <line x1="790" y1="295" x2="830" y2="295" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="835" y="265" width="140" height="60" rx="8" fill="#1a2234" stroke="#46d3ac" stroke-width="1.5"/>
    <text x="905" y="285" fill="#e4e8f1" font-size="12.5" font-weight="600" text-anchor="middle">gold</text>
    <text x="905" y="300" fill="#9aa5bd" font-size="10" text-anchor="middle">dim_symbol, fct_trade,</text>
    <text x="905" y="312" fill="#9aa5bd" font-size="10" text-anchor="middle">fct_ohlc_1m</text>
  </g>

  <text x="460" y="350" fill="#7d8aa8" font-size="10.5">schema tests: not_null, unique, relationships —</text>
  <text x="460" y="364" fill="#7d8aa8" font-size="10.5">CI runs isolated in ci_silver / ci_gold</text>

  <!-- Gold -> Snowflake -->
  <line x1="905" y1="325" x2="905" y2="500" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="915" y="420" fill="#7d8aa8" font-size="10.5">spark.sql() load job</text>
  <text x="915" y="434" fill="#7d8aa8" font-size="10.5">(scheduled)</text>

  <g>
    <rect x="805" y="505" width="200" height="70" rx="8" fill="#1a2234" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="905" y="533" fill="#e4e8f1" font-size="13" font-weight="600" text-anchor="middle">Snowflake</text>
    <text x="905" y="551" fill="#9aa5bd" font-size="11" text-anchor="middle">data warehouse</text>
  </g>

  <line x1="1005" y1="540" x2="1050" y2="540" stroke="#8b94a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="1055" y="505" width="220" height="70" rx="8" fill="#1a2234" stroke="#6ee7c9" stroke-width="1.5"/>
    <text x="1165" y="533" fill="#e4e8f1" font-size="13" font-weight="600" text-anchor="middle">Metabase</text>
    <text x="1165" y="551" fill="#9aa5bd" font-size="11" text-anchor="middle">candle chart + volume ranking</text>
  </g>

  <!-- Orchestration band -->
  <rect x="30" y="580" width="1300" height="45" rx="8" fill="#161d2e" stroke="#262f45" stroke-width="1"/>
  <text x="48" y="607" fill="#e0a752" font-size="11.5" font-weight="600">Databricks Workflow (serverless, scheduled):</text>
  <text x="330" y="607" fill="#9aa5bd" font-size="11.5">ingest_bronze → dbt_transform → load_snowflake</text>
  <text x="760" y="607" fill="#46d3ac" font-size="11.5" font-weight="600">CI/CD:</text>
  <text x="815" y="607" fill="#9aa5bd" font-size="11.5">GitHub Actions — lint + dbt test on PRs, bundle deploy on merge to main</text>
</svg>
