version: 2

models:
  - name: stg_trades
    description: Deduplicated, type-conformed trade events. Grain one row per trade per symbol.
    columns:
      - name: trade_id
        description: Binance's trade ID, unique per symbol.
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: trade_timestamp
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - symbol
              - trade_id